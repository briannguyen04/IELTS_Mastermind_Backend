# ========================
# APP
# ========================
spring.application.name=ielts_mastermind_db
server.port=${PORT:8080}

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate auto-detect dialect (IMPORTANT)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# OPTIONAL: explicitly set MySQL dialect (safe alternative)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
app.ngrok-url=https://sharen-unshrined-amie.ngrok-free.dev
# ========================
# REDIS (optional)
# ========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ========================
# MAIL
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# API KEY
# ========================
api-key=${API_KEY}

# ========================
# OAUTH
# ========================
spring.security.oauth2.client.registration.google.client-id=659690260410-...
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.facebook.client-id=1493882018986455
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}